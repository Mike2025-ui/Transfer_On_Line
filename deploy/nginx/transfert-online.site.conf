# Install as /etc/nginx/sites-available/transfert-online.site
# Enable with: sudo ln -sf /etc/nginx/sites-available/transfert-online.site /etc/nginx/sites-enabled/
# Reload with: sudo nginx -t && sudo systemctl reload nginx

upstream transfer_on_line_backend {
    server 127.0.0.1:8000;
}

# Redirection HTTP vers HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name transfert-online.site www.transfert-online.site 180.149.198.189;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://transfert-online.site$request_uri;
    }
}

# Serveur HTTPS principal
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name transfert-online.site www.transfert-online.site;

    ssl_certificate /etc/letsencrypt/live/transfert-online.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/transfert-online.site/privkey.pem;

    # Sécurité SSL
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;

    client_max_body_size 20m;

    # Compression gzip pour accélérer le chargement Web
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml application/wasm;

    # --------------------------------------------------------------------------
    # 1. API REST Django (Mobile client, Passerelles Gateway, Webhooks Jèko)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 2. Back Office Dashboard Django
    # --------------------------------------------------------------------------
    location /dashboard/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 3. Connexion & Déconnexion du Dashboard
    # --------------------------------------------------------------------------
    location ~ ^/(login|logout)/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 4. Administration Django
    # --------------------------------------------------------------------------
    location /admin/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # --------------------------------------------------------------------------
    # 5. Fichiers statiques et médias du Backend Django
    # --------------------------------------------------------------------------
    location /static/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /media/ {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --------------------------------------------------------------------------
    # 6. Frontend Web Flutter (Application client servie à la racine /)
    # --------------------------------------------------------------------------
    location / {
        root /var/www/transfert-online/frontend-web;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Support WebAssembly
        types {
            application/wasm wasm;
        }

        # Ne pas mettre en cache index.html pour charger immédiatement les mises à jour
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
        }

        # Cache pour les assets statiques Flutter (images, polices, scripts hashés)
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|wasm)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            try_files $uri =404;
        }
    }
}
