# Temporary HTTP-only configuration used before the first Let's Encrypt certificate.
# Replace it with transfert-online.site.conf after certbot succeeds.

upstream transfer_on_line_backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    listen [::]:80;
    server_name transfert-online.site www.transfert-online.site 180.149.198.189;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://transfer_on_line_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_redirect off;
    }
}
