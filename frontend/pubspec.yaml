publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.1.0
  flutter_animate: ^4.3.0
  intl: ^0.20.2
  shared_preferences: ^2.2.2
  http: ^1.6.0
  url_launcher: ^6.3.1
