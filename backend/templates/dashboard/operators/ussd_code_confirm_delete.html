{% extends 'base.html' %}

{% block content %}
<div class="container-fluid px-4">
    <div class="d-flex justify-content-end mb-3">
        <a href="{% url 'ussd_codes' pk=operator.pk %}" class="btn btn-outline-secondary">
            <i class="fas fa-arrow-left me-1"></i> Retour
        </a>
    </div>

    <div class="card border-0 shadow-sm" style="max-width: 560px;">
        <div class="card-body">
            {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
            <a href="{% url 'ussd_code_edit' pk=object.pk %}" class="btn btn-outline-secondary">
                Désactiver depuis la fiche du code
            </a>
            {% else %}
            <p>Supprimer définitivement le code <strong>{{ object.label }}</strong>
                (<code>{{ object.template }}</code>) pour {{ operator.name }} ?</p>
            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash me-1"></i> Confirmer la suppression
                </button>
                <a href="{% url 'ussd_codes' pk=operator.pk %}" class="btn btn-outline-secondary">Annuler</a>
            </form>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
