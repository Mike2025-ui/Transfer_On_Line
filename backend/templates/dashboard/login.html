<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Back Office - Transfer On Line</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root {
            --tol-ink: #0f2419;
            --tol-green: #0e6e4a;
            --tol-green-dark: #0a3d29;
            --tol-green-bright: #16a366;
            --tol-paper: #f4f6f5;
            --tol-line: #e2e6e4;
            --tol-red: #c0392b;
        }
        body {
            background: linear-gradient(180deg, var(--tol-green-dark) 0%, var(--tol-ink) 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card { background: #fff; border-radius: 14px; padding: 40px 36px; width: 100%; max-width: 380px; box-shadow: 0 10px 40px rgba(0,0,0,0.25); }
        .login-card .logo { width: 46px; height: 46px; border-radius: 10px; background: var(--tol-green-bright); display: flex; align-items: center; justify-content: center; margin-bottom: 14px; }
        .login-card h4 { font-weight: 700; color: var(--tol-ink); margin-bottom: 2px; }
        .login-card small { color: #6b7a72; }
        .form-control:focus { border-color: var(--tol-green-bright); box-shadow: 0 0 0 0.2rem rgba(22,163,102,0.15); }
        .btn-login { background: var(--tol-green); border-color: var(--tol-green); }
        .btn-login:hover { background: var(--tol-green-dark); border-color: var(--tol-green-dark); }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo"><i class="fas fa-arrow-right text-white"></i></div>
        <h4>TRANSFER ONLINE</h4>
        <small>Back Office - Espace administrateur</small>
        <hr class="my-3">
        {% if error %}
        <div class="alert alert-danger py-2 small" role="alert">{{ error }}</div>
        {% endif %}
        {% if form.non_field_errors %}
        <div class="alert alert-danger py-2 small" role="alert">{{ form.non_field_errors|join:" " }}</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="mb-3">
                <label for="id_username" class="form-label small fw-semibold">Identifiant</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label for="id_password" class="form-label small fw-semibold">Mot de passe</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-login text-white w-100">Se connecter</button>
        </form>
    </div>
</body>
</html>
